<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz aniversário, Sergio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F6FF;
    --cobalt:#1F3FD8;
    --cobalt-deep:#162FA8;
    --ink:#14163A;
    --pen:#E5261B;
    --sun:#FFD23F;
    --gum:#FF5DA2;
    --white:#FFFFFF;
    --note-text:#14163A;
    --muted:#4A4E7A;
    --display:"Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --hand:"Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1230; --ink:#EEF0FF; --muted:#B4B9E6; --cobalt:#3B58F0; --cobalt-deep:#1A2577;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1230; --ink:#EEF0FF; --muted:#B4B9E6; --cobalt:#3B58F0; --cobalt-deep:#1A2577;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased}
  img{max-width:100%}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--gum);outline-offset:3px}

  /* ---------- Hero ---------- */
  .hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:clamp(1.5rem,5vw,4rem);position:relative;overflow:hidden}
  .hero h1{margin:0;font-weight:800;color:var(--cobalt);letter-spacing:-.035em;line-height:.86;font-variation-settings:"opsz" 96,"wdth" 85}
  .hero .l1{display:block;font-size:clamp(2.6rem,13vw,9.5rem)}
  .hero .l2{display:block;font-size:clamp(6rem,38vw,26rem);margin-top:.1em;white-space:nowrap;position:relative;width:max-content}
  .acento{position:relative;display:inline-block}
  .risco{position:absolute;left:.11em;top:.035em;width:.33em;height:.2em;overflow:visible;pointer-events:none}
  .risco path{fill:none;stroke:var(--pen);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .nota{position:absolute;left:.98em;top:-.01em;line-height:1;transform:rotate(-6deg);transform-origin:left bottom;white-space:nowrap}
  .nota-txt{display:block;position:relative;font-family:var(--hand);font-weight:700;color:var(--pen);letter-spacing:0;font-size:clamp(1.5rem,4.4vw,3.6rem)}
  .nota-txt svg{position:absolute;left:-1.25em;top:.45em;width:1.15em;height:.8em;overflow:visible}
  .nota-txt svg path{fill:none;stroke:var(--pen);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .hero-foot{margin-top:clamp(2rem,6vh,4rem);display:flex;flex-wrap:wrap;gap:1rem 2.5rem;align-items:baseline;justify-content:flex-start;max-width:60rem}
  .hero-foot p{margin:0;font-size:clamp(1.1rem,2.2vw,1.5rem);color:var(--muted);max-width:34ch}
  .hero-foot a{font-weight:700;color:var(--cobalt);text-decoration:none;border-bottom:3px solid var(--sun);padding-bottom:2px}

  .retrato{width:clamp(10rem,50vw,15rem);margin:2.5rem .5rem 3rem auto;padding-bottom:.75rem;transform:rotate(3deg);flex:none}
  @media (min-width:1000px){
    .hero .l1{font-size:clamp(2.6rem,9vw,9.5rem)}
    .hero .l2{font-size:clamp(6rem,26vw,26rem)}
    .retrato{position:absolute;right:clamp(2rem,4.5vw,5rem);top:50%;width:clamp(15rem,24vw,22rem);margin:0;transform:translateY(-50%) rotate(3deg)}
  }
  /* draw-on animation, one moment only */
  .risco path{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .9s .5s ease-out forwards}
  .nota{opacity:0;animation:pop .4s 1.35s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:rotate(-6deg) translateY(.2em)}to{opacity:1;transform:rotate(-6deg)}}
  @media (prefers-reduced-motion: reduce){
    .risco path{animation:none;stroke-dashoffset:0}
    .nota{animation:none;opacity:1}
  }

  /* ---------- Sections ---------- */
  section{padding:clamp(3.5rem,9vw,7rem) clamp(1.25rem,5vw,4rem)}
  .wrap{max-width:72rem;margin:0 auto}
  h2{font-size:clamp(2.2rem,6vw,4.25rem);line-height:.95;letter-spacing:-.03em;font-weight:800;margin:0 0 .6rem;font-variation-settings:"opsz" 72,"wdth" 85}
  .lede{margin:0 0 2.5rem;max-width:52ch;font-size:1.15rem}

  /* ---------- Recados ---------- */
  .recados{background:var(--cobalt);color:var(--white)}
  .recados .lede{color:#D8DEFF;margin-bottom:1rem}

  .mural{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr));gap:3rem 2rem;align-items:start;padding-top:2.5rem}
  .bilhete{position:relative;margin:0;padding:1.6rem 1.5rem 1.2rem;color:var(--note-text);border-radius:4px 4px 18px 4px;box-shadow:0 14px 0 -8px rgba(0,0,0,.18);transform:rotate(var(--r,0deg))}
  .bilhete p{margin:0;overflow-wrap:anywhere;font-size:clamp(1.15rem,1.6vw,1.3rem);line-height:1.4;font-weight:600;max-width:24ch}
  .bilhete.extra{grid-column:1/-1;justify-self:center;width:min(100%,32rem);margin-top:.5rem}
  .bilhete.extra p{max-width:none}
  .bilhete em{font-style:italic;font-weight:700}
  .bilhete .chapeu-bilhete{position:absolute;top:-3.2rem;right:1rem;width:3.2rem;transform:rotate(14deg);overflow:visible}
  .bilhete footer{font-family:var(--hand);font-size:1.75rem;font-weight:700;margin-top:.9rem;line-height:1.05}

  .moldura{margin:0;background:var(--white);padding:.75rem .75rem 0;border:3px solid var(--ink);border-radius:6px;box-shadow:7px 7px 0 var(--gum)}
  :root[data-theme="dark"] .moldura{border-color:#EEF0FF}
  .quadro{position:relative;aspect-ratio:4/5;background:#E4E8FF;overflow:visible;border-radius:2px}
  .quadro img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}
  .chapeu{position:absolute;width:calc(var(--s,30) * 1%);left:calc(var(--x,50) * 1%);top:calc(var(--y,10) * 1%);transform:translate(-50%,-92%) rotate(var(--r,0deg));transform-origin:50% 100%;pointer-events:none;overflow:visible}
  .moldura figcaption{font-family:var(--hand);font-size:1.6rem;font-weight:700;color:#14163A;padding:.6rem .2rem .7rem;line-height:1.1}

  footer.fim{background:var(--ink);color:var(--paper);text-align:center;padding:3rem 1.5rem calc(3rem + env(safe-area-inset-bottom,0px))}
  :root[data-theme="dark"] footer.fim{background:#05071A;color:#EEF0FF}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) footer.fim{background:#05071A;color:#EEF0FF}}
  .acao{display:flex;align-items:center;flex-wrap:wrap;gap:.75rem 1.25rem;margin:1.25rem 0 1.75rem}
  .recolher{display:inline-flex;align-items:center;gap:.7rem;font:inherit;font-weight:800;font-size:clamp(1.15rem,2.2vw,1.45rem);letter-spacing:-.01em;background:var(--sun);color:#14163A;border:3px solid #14163A;border-radius:999px;padding:.85rem 1.9rem .85rem 1.2rem;cursor:pointer;box-shadow:6px 6px 0 var(--gum);transform:rotate(-1.5deg);transition:transform .15s ease, box-shadow .15s ease}
  .recolher svg{width:1.9rem;flex:none;overflow:visible;transform:rotate(-12deg)}
  .recolher:active{transform:rotate(-1.5deg) translate(3px,3px);box-shadow:3px 3px 0 var(--gum)}
  .dica{position:relative;font-family:var(--hand);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);color:var(--sun);padding-left:2.4rem;transform:rotate(-4deg);line-height:1}
  .dica svg{position:absolute;left:0;top:-.1em;width:2.1rem;height:1.4rem;overflow:visible}
  .dica svg path{fill:none;stroke:var(--sun);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  @media (hover:hover){.recolher:hover{transform:rotate(-1.5deg) translate(-2px,-2px);box-shadow:8px 8px 0 var(--gum)}}
  .mural.recolhido{grid-template-columns:min(100%,24rem);justify-content:center;padding-top:4rem;cursor:pointer}
  .mural.recolhido .bilhete{grid-area:1/1;transform:translate(calc(var(--i) * 5px),calc(var(--i) * -6px)) rotate(calc(var(--r) * 2.2))}
  .mural.recolhido .bilhete.extra{width:auto;margin-top:0}
  footer.fim p{margin:0;font-family:var(--hand);font-size:clamp(1.8rem,5vw,2.6rem);font-weight:700}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<!-- party hat, reused everywhere -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="cone"><path d="M50 8 L88 118 Q50 132 12 118 Z"/></clipPath>
    <symbol id="chapeu" viewBox="0 0 100 140">
      <g clip-path="url(#cone)">
        <rect x="0" y="0" width="100" height="140" fill="#FF5DA2"/>
        <g fill="#FFD23F">
          <path d="M0 44 L100 14 L100 30 L0 60 Z"/>
          <path d="M0 84 L100 54 L100 70 L0 100 Z"/>
          <path d="M0 124 L100 94 L100 110 L0 140 Z"/>
        </g>
        <g fill="#1F3FD8"><circle cx="38" cy="72" r="4"/><circle cx="62" cy="96" r="4"/><circle cx="54" cy="44" r="3.5"/><circle cx="30" cy="108" r="4"/></g>
      </g>
      <path d="M50 8 L88 118 Q50 132 12 118 Z" fill="none" stroke="#14163A" stroke-width="3" stroke-linejoin="round"/>
      <path d="M12 118 Q50 132 88 118" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".9"/>
      <g fill="#FFD23F" stroke="#14163A" stroke-width="2.5">
        <circle cx="50" cy="8" r="9"/>
      </g>
      <g stroke="#E5261B" stroke-width="3" stroke-linecap="round"><path d="M50 -4 L50 -12"/><path d="M59 0 L66 -6"/><path d="M41 0 L34 -6"/></g>
    </symbol>
  </defs>
</svg>

<header class="hero">
  <figure class="moldura retrato" id="retrato"></figure>
  <h1>
    <span class="l1">Feliz aniversário,</span>
    <span class="l2"><span class="sr">Sergio</span><span aria-hidden="true">S<span class="acento">é<svg class="risco" viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M18 46 C30 30 44 26 60 14 M14 30 C34 34 56 20 82 22 M24 52 C42 38 62 34 86 34"/></svg></span>rgio<span class="nota"><span class="nota-txt">sem acento!<svg viewBox="0 0 60 40"><path d="M58 8 C42 2 18 6 4 26 M4 26 L3 13 M4 26 L17 25"/></svg></span></span></span></span>
  </h1>
  <div class="hero-foot">
    <p>Do time inteiro, com carinho. E, como você sempre pede, sem acento.</p>
    <a href="#recados">Ler os recados dos museus</a>
  </div>
</header>

<section class="recados" id="recados" aria-labelledby="t-recados">
  <div class="wrap">
    <h2 id="t-recados">Recados dos museus</h2>
    <p class="lede">Os projetos (e até a IA) fizeram questão de deixar um recado.</p>
    <div class="acao">
      <button class="recolher" id="recolher" type="button" aria-pressed="false" aria-controls="mural"><svg viewBox="0 -14 100 154" aria-hidden="true"><use href="#chapeu"/></svg><span id="recolher-txt">Recolher tudo</span></button>
      <span class="dica" aria-hidden="true"><svg viewBox="0 0 60 40"><path d="M58 30 C44 36 22 34 6 14 M6 14 L5 27 M6 14 L18 16"/></svg>clica aqui!</span>
    </div>
    <div class="mural" id="mural"></div>
  </div>
</section>

<footer class="fim">
  <p>Parabéns, Sergio. Com carinho, do time do idg.</p>
</footer>

  { de: "Museu do Jardim Botânico", texto: "A espécie mais rara do jardim: <em>Sergius mendesii</em>, sem acento.", cor: "#FF8CC0", r: 2.2 },
  { de: "Paço do Frevo", texto: "Mais um ano e nunca perdeu o passo. Feliz aniversário!", cor: "#FFFFFF", r: -2.4 },
  { de: "Museu das Favelas", texto: "Museu bom é feito de gente. Feliz aniversário pra quem junta a gente toda.", cor: "#FFD23F", r: 1 },
  { de: "Claude, a IA do time", texto: "Sergio, esse time me fez escrever recado até em nome de museu. Aproveita que é seu aniversário e aprova minhas férias?<br><br>PS: escrevi seu nome sem acento todas as vezes.", cor: "#9BE8B4", r: -1.4, extra: true }
];
document.getElementById("mural").innerHTML = RECADOS.map((m, i) => `
  <article class="bilhete${m.extra ? " extra" : ""}" style="background:${m.cor};--r:${m.r}deg;--i:${i}">
    <svg class="chapeu-bilhete" viewBox="0 -14 100 154" aria-hidden="true"><use href="#chapeu"/></svg>
    <p>${m.texto}</p>
    <footer>${m.de}</footer>
  </article>`).join("");

/* Recolher / espalhar os bilhetes, com animação FLIP */
const mural = document.getElementById("mural");
const botao = document.getElementById("recolher");
const semMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function alterna(){
  const bilhetes = [...mural.querySelectorAll(".bilhete")];
  const antes = bilhetes.map(b => b.getBoundingClientRect());
  const recolhido = mural.classList.toggle("recolhido");
  document.getElementById("recolher-txt").textContent = recolhido ? "Espalhar os recados" : "Recolher tudo";
  document.querySelector(".dica").hidden = recolhido;
  botao.setAttribute("aria-pressed", String(recolhido));
  mural.title = recolhido ? "Clique para espalhar os recados" : "";
  if(semMovimento || !bilhetes[0].animate) return;
  bilhetes.forEach((b, i) => {
    const depois = b.getBoundingClientRect();
    const dx = antes[i].left + antes[i].width/2 - (depois.left + depois.width/2);
    const dy = antes[i].top + antes[i].height/2 - (depois.top + depois.height/2);
    const fim = getComputedStyle(b).transform;
    b.animate([{transform:`translate(${dx}px, ${dy}px) ${fim === "none" ? "" : fim}`},{transform: fim}],
      {duration:550, delay:i*35, easing:"cubic-bezier(.2,.8,.2,1)", fill:"backwards"});
  });
}
botao.addEventListener("click", alterna);
mural.addEventListener("click", () => { if(mural.classList.contains("recolhido")) alterna(); });
</script>
